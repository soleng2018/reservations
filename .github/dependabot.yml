version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Proposes the Postgres digest bump in docker/compose.yaml (the `docker`
  # ecosystem reads only Dockerfiles).
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
