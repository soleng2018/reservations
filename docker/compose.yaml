# The app's containers (spec 0001): its own Postgres (`db`), the one shot
# `migrate`, `web`, and `worker`. A fresh clone runs `npm run db:up` first.
# scripts/deploy.sh takes a pg_dump before `migrate` runs. The Cloudflare Tunnel
# already sends *.nile.global to Traefik, so `web` needs only the Traefik labels.
#
#   cp docker/.env.example docker/.env   # optional for the database, needed for web
name: reservations

x-env: &env
  TZ: UTC
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: reservations
  DATABASE_PASSWORD_FILE: /run/secrets/hol_app_password
  AUTHENTIK_CLIENT_SECRET_FILE: /run/secrets/authentik_client_secret
  AUTH_SECRET_FILE: /run/secrets/auth_secret
  AUTHENTIK_PROVISIONING_TOKEN_FILE: /run/secrets/authentik_provisioning_token
  APP_ENCRYPTION_KEYS_FILE: /run/secrets/hol_encryption_keys

x-app: &app
  image: reservations:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *env
  secrets:
    - hol_app_password
    - authentik_client_secret
    - auth_secret
    - authentik_provisioning_token
    - hol_encryption_keys
  depends_on:
    migrate: { condition: service_completed_successfully }
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  # The only place the Postgres version is chosen. Tag for people, digest for
  # the machine (the multi architecture index digest). A major bump is a dump
  # and restore into a new volume, never a tag change.
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservations
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    secrets: [postgres_password]
    volumes:
      - hol_pgdata:/var/lib/postgresql
    # Host side only; containers use db:5432 on hol-internal.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    networks: [hol-internal]
    # The TCP address matters: first start runs a temporary socket only server.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d reservations -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  migrate:
    image: reservations:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: "no"
    command: ["node", "dist/migrate.mjs"]
    environment: *env
    secrets: [hol_app_password]
    networks: [hol-internal]
    depends_on:
      db: { condition: service_healthy }
    healthcheck: { disable: true }

  web:
    <<: *app
    environment:
      <<: *env
      # Every request reaches web through the tunnel, so CF-Connecting-IP is real.
      TRUST_PROXY_HEADERS: "true"
    networks: [traefik, hol-internal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.reservations.rule: Host(`${APP_HOST}`)
      traefik.http.routers.reservations.entrypoints: websecure
      traefik.http.routers.reservations.tls: "true"
      traefik.http.routers.reservations.tls.certresolver: letsencrypt
      traefik.http.routers.reservations.service: reservations-svc
      traefik.http.services.reservations-svc.loadbalancer.server.port: "3000"

  worker:
    <<: *app
    # The worker target adds Chromium (spec 0023 AC-40); web and migrate stay
    # on the smaller runner target.
    image: reservations-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    command: ["node", "dist/worker.mjs"]
    # Chromium keeps its shared memory in /dev/shm; Docker's 64 MB is too small.
    shm_size: 1gb
    environment:
      <<: *env
      # The one worker. Its advisory lock keeps it to one per database.
      WORKER_ENABLED: "true"
    # The traefik network is only its route out (Authentik, Google,
    # Cloudflare); it has no Traefik labels.
    networks: [traefik, hol-internal]
    # SIGTERM finishes the current step; give a job time to complete.
    stop_grace_period: 60s
    healthcheck: { disable: true }

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-../.secrets}/postgres_password
  hol_app_password:
    file: ${SECRETS_DIR:-../.secrets}/hol_app_password
  authentik_client_secret:
    file: ${SECRETS_DIR:-../.secrets}/authentik_client_secret
  auth_secret:
    file: ${SECRETS_DIR:-../.secrets}/auth_secret
  authentik_provisioning_token:
    file: ${SECRETS_DIR:-../.secrets}/authentik_provisioning_token
  hol_encryption_keys:
    file: ${SECRETS_DIR:-../.secrets}/hol_encryption_keys.json

networks:
  traefik:
    external: true
  # Created by this project. Not `internal`, or Docker would not publish the
  # db port on the host.
  hol-internal:

volumes:
  hol_pgdata:
